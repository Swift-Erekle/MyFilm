<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MyFilm — უყურე ფილმებს, სერიალებსა და ანიმეს ონლაინ ქართულად.">
  <meta name="theme-color" content="#0a0a0f">
  <title>MyFilm — ონლაინ კინო</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- ===== NAVBAR (ყოველთვის ხილული) ===== -->
  <nav id="navbar">
    <a class="nav-brand" href="/" data-route id="nav-home">
      <svg class="nav-logo-icon" viewBox="0 0 40 40" fill="none">
        <rect width="40" height="40" rx="10" fill="#e50914"/>
        <polygon points="20,10 32,20 20,30" fill="white" opacity="0.9"/>
        <path d="M8 30V10l10 10L8 30z" fill="white"/>
      </svg>
      <span class="nav-logo-text">MyFilm</span>
    </a>

    <button class="nav-burger" id="nav-burger" aria-label="Toggle Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="nav-links">
      <a href="/"          data-route id="nav-home-link">მთავარი</a>
      <a href="/movies"    data-route id="nav-movies">ფილმები</a>
      <a href="/tv"        data-route id="nav-tv">სერიალები</a>
      <a href="/anime"     data-route id="nav-anime">ანიმე</a>
      <a href="/animation" data-route id="nav-animation">ანიმაცია</a>
      <a href="/search"    data-route id="nav-search">ძიება</a>
    </div>

    <div class="nav-right">
      <a href="https://github.com/Swift-Erekle/MyFilm/releases/download/v1.0.0/MyFilm.apk" id="app-download-open" class="nav-download-btn" title="ჩამოტვირთე Android აპლიკაცია (APK)">
        <span>📲 აპლიკაცია</span>
      </a>
      <div class="nav-search-wrap">
        <span class="nav-search-icon">🔍</span>
        <input
          id="nav-search-input"
          type="search"
          placeholder="ძებნა..."
          autocomplete="off"
          spellcheck="false"
        >
      </div>
    </div>
  </nav>

  <!-- ===== VIEWS ===== -->
  <!-- Home -->
  <div id="view-home"   class="view view--active"></div>
  <!-- Browse Views -->
  <div id="view-movies"    class="view view--hidden"></div>
  <div id="view-tv"        class="view view--hidden"></div>
  <div id="view-anime"     class="view view--hidden"></div>
  <div id="view-animation" class="view view--hidden"></div>
  <!-- Detail -->
  <div id="view-movie" class="view view--hidden"></div>
  <!-- Search -->
  <div id="view-search" class="view view--hidden"></div>

  <!-- ===== FOOTER ===== -->
  <footer id="site-footer">
    <div class="footer-logo">MyFilm</div>
    <p class="footer-text">
      &copy; 2026 MyFilm &nbsp;|&nbsp;
      ფილმების მეტა-ინფო:
      <a href="https://www.themoviedb.org" target="_blank" rel="noopener" style="color:var(--accent)">TMDB</a>
    </p>
  </footer>

  <!-- Toast -->
  <div id="toast-container" aria-live="polite"></div>

  <dialog id="app-download-dialog" class="app-download-dialog" aria-labelledby="app-download-title">
    <button class="dialog-close" id="app-download-close" aria-label="დახურვა">×</button>
    <div class="dialog-app-icon" aria-hidden="true">▶</div>
    <h2 id="app-download-title">MyFilm Android აპი</h2>
    <p>ჩამოტვირთე ოფიციალური APK და უყურე MyFilm-ს ტელეფონიდან ან Android TV-დან.</p>
    <a class="btn-primary dialog-download" href="https://github.com/Swift-Erekle/MyFilm/releases/download/v1.0.0/MyFilm.apk">📲 APK-ის ჩამოტვირთვა</a>
  </dialog>

  <!-- ===== SCRIPTS (order matters!) ===== -->
  <script src="/js/config.js"></script>
  <script src="/js/custom_animes.js"></script>
  <script src="/js/router.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/player_v3.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/home.js"></script>
  <script src="/js/browse.js"></script>
  <script src="/js/detail_v3.js"></script>
  <script src="/js/search_v3.js"></script>

  <!-- ===== APP BOOTSTRAP ===== -->
  <script>
    // ---- Navbar scroll ----
    (function() {
      const nav = document.getElementById('navbar');
      window.addEventListener('scroll', () =>
        nav.classList.toggle('scrolled', window.scrollY > 40), { passive: true });

      // Nav-search live
      const inp = document.getElementById('nav-search-input');
      let t;
      inp.addEventListener('input', () => {
        const q = inp.value.trim();
        clearTimeout(t);
        if (q.length >= 2) {
          t = setTimeout(() => {
            Router.go('/search/' + encodeURIComponent(q));
          }, 380);
        }
      });
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter' && inp.value.trim()) {
          Router.go('/search/' + encodeURIComponent(inp.value.trim()));
          inp.value = '';
        }
      });

      document.querySelectorAll('[data-route]').forEach(link => {
        link.addEventListener('click', event => {
          event.preventDefault();
          Router.go(link.getAttribute('href'));
        });
      });

      // Nav links — active highlight
      function setActiveNav() {
        const current = window.location.pathname;
        document.querySelectorAll('.nav-links a').forEach(a => {
          const target = a.getAttribute('href');
          a.classList.toggle('active', target === '/' ? current === '/' : current.startsWith(target));
        });
        if (current === '/') {
          document.getElementById('nav-home-link').classList.add('active');
        }
      }
      window.addEventListener('myfilm:navigation', setActiveNav);
      setActiveNav();

      const downloadDialog = document.getElementById('app-download-dialog');
      document.getElementById('app-download-open')?.addEventListener('click', event => {
        event.preventDefault();
        if (typeof downloadDialog?.showModal === 'function') downloadDialog.showModal();
        else window.location.href = event.currentTarget.href;
      });
      document.getElementById('app-download-close')?.addEventListener('click', () => downloadDialog?.close());
      downloadDialog?.addEventListener('click', event => {
        if (event.target === downloadDialog) downloadDialog.close();
      });

      // Burger Menu Toggle
      const burger = document.getElementById('nav-burger');
      const navLinks = document.querySelector('.nav-links');
      
      burger.addEventListener('click', () => {
        burger.classList.toggle('open');
        navLinks.classList.toggle('nav-open');
        
        if (navLinks.classList.contains('nav-open')) {
          document.body.style.overflow = 'hidden'; // Prevent background scrolling
        } else {
          document.body.style.overflow = '';
        }
      });
      
      // Close menu when a link is clicked
      document.querySelectorAll('.nav-links a').forEach(link => {
        link.addEventListener('click', () => {
          burger.classList.remove('open');
          navLinks.classList.remove('nav-open');
          document.body.style.overflow = '';
        });
      });
    })();

    // ---- Register routes ----
    Router.register('home',      params => HomeView.render(params));
    Router.register('movie',     params => DetailView.render(params));
    Router.register('search',    params => SearchView.render(params));

    // Initialize BrowseViews
    const MoviesView    = BrowseView.create('view-movies',    'MOVIES_SECTIONS',    '/movie/popular',                 '🎬 ფილმი');
    const TvView        = BrowseView.create('view-tv',        'TV_SECTIONS',        '/tv/popular',                    '📺 სერიალი');
    const AnimeView     = BrowseView.create('view-anime',     'ANIME_SECTIONS',     '/discover/tv?with_genres=16&with_original_language=ja&sort_by=vote_count.desc', '🌸 ანიმე');
    const AnimationView = BrowseView.create('view-animation', 'ANIMATION_SECTIONS', '/discover/movie?with_genres=16&sort_by=popularity.desc', '🎨 ანიმაცია');

    Router.register('movies',    params => MoviesView.render(params));
    Router.register('tv',        params => TvView.render(params));
    Router.register('anime',     params => AnimeView.render(params));
    Router.register('animation', params => AnimationView.render(params));

    // ---- Start ----
    Router.init();
  </script>

</body>
</html>
