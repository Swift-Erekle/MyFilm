<html lang="ka">
<head>

  <title>MyFilm — კავშირი არ არის</title>

<body>
  <main class="card">
    <div class="logo" aria-hidden="true">▶▶</div>

    <button type="button" onclick="location.reload()">თავიდან ცდა</button>
  </main>
