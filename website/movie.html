<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MyFilm — ფილმის დეტალები და ყურება ონლაინ.">
  <title>MyFilm — ფილმი</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <nav id="navbar">
    <a class="nav-brand" href="#/home" id="nav-home">
      <svg class="nav-logo-icon" viewBox="0 0 40 40" fill="none">
        <rect width="40" height="40" rx="10" fill="#e50914"/>
        <polygon points="20,10 32,20 20,30" fill="white" opacity="0.9"/>
        <path d="M8 30V10l10 10L8 30z" fill="white"/>
      </svg>
      <span class="nav-logo-text">MyFilm</span>
    </a>
    <div class="nav-links">
      <a href="index.html">მთავარი</a>
      <a href="search.html?filter=movie">ფილმები</a>
      <a href="search.html?filter=tv">სერიალები</a>
      <a href="search.html">ძიება</a>
    </div>
    <div class="nav-right">
      <div class="nav-search-wrap">
        <span class="nav-search-icon">🔍</span>
        <input id="nav-search-input" type="search" placeholder="ძებნა..." autocomplete="off">
      </div>
    </div>
  </nav>

  <!-- ===== DETAIL HERO (dynamically filled) ===== -->
  <div class="detail-page">
    <div id="detail-hero" class="detail-hero">
      <div class="page-loader" style="height:80vh;display:flex;align-items:center;justify-content:center">
        <div class="spinner"></div>
      </div>
    </div>

    <!-- ===== BODY (player, episodes, similar) ===== -->
    <div id="detail-body" class="detail-body"></div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="footer-logo">MyFilm</div>
    <p class="footer-text">&copy; 2025 MyFilm — ყველა უფლება დაცულია</p>
  </footer>

  <div id="toast-container" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/player_v3.js"></script>
  <script src="js/detail_v3.js"></script>
</body>
</html>
