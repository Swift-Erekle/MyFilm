<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ძებნა — MyFilm. იპოვე ფილმები და სერიალები.">
  <title>ძიება — MyFilm</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Extra styles for search page */
    .search-page-wrap {
      padding-top: var(--nav-h);
      min-height: 100vh;
    }
  </style>
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <nav id="navbar">
    <a class="nav-brand" href="#/home" id="nav-home">
      <svg class="nav-logo-icon" viewBox="0 0 40 40" fill="none">
        <rect width="40" height="40" rx="10" fill="#e50914"/>
        <polygon points="20,10 32,20 20,30" fill="white" opacity="0.9"/>
        <path d="M8 30V10l10 10L8 30z" fill="white"/>
      </svg>
      <span class="nav-logo-text">MyFilm</span>
    </a>
    <div class="nav-links">
      <a href="index.html">მთავარი</a>
      <a href="search.html?filter=movie">ფილმები</a>
      <a href="search.html?filter=tv">სერიალები</a>
      <a href="search.html" class="active">ძიება</a>
    </div>
    <div class="nav-right">
      <div class="nav-search-wrap">
        <span class="nav-search-icon">🔍</span>
        <input id="nav-search-input" type="search" placeholder="ძებნა..." autocomplete="off">
      </div>
    </div>
  </nav>

  <div class="search-page-wrap">
    <!-- Hero search area -->
    <div class="search-hero">
      <h1>🔍 ძიება</h1>
      <p>იპოვე შენი საყვარელი ფილმი ან სერიალი</p>

      <div class="search-input-wrap">
        <span class="search-icon-big">🔍</span>
        <input
          id="search-input"
          type="search"
          placeholder="ჩაწერე ფილმის სახელი..."
          autocomplete="off"
          spellcheck="false"
          autofocus
        >
      </div>

      <div class="search-filters">
        <button class="filter-btn active" data-filter="all">🎬 ყველა</button>
        <button class="filter-btn" data-filter="movie">🎥 ფილმები</button>
        <button class="filter-btn" data-filter="tv">📺 სერიალები</button>
      </div>
    </div>

    <!-- Results -->
    <div class="search-results-wrap" id="search-results-wrap">
      <p class="search-results-info" id="search-results-info"></p>
      <div class="results-grid" id="results-grid"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer style="margin-top:60px">
    <div class="footer-logo">MyFilm</div>
    <p class="footer-text">&copy; 2025 MyFilm — ყველა უფლება დაცულია</p>
  </footer>

  <div id="toast-container" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/search_v3.js"></script>
</body>
</html>
