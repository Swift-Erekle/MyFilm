name: Deep live validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - cloudflare.js
      - src/providers/**
      - scripts/provider-diagnostics.js
      - scripts/run-live-tests.js
      - test/live.test.js

permissions:
  contents: read

jobs:
  live-providers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13
          cache: npm
      - run: npm ci
      - name: Live provider diagnostics
        run: npm run diagnose:providers
      - name: Live scraper canaries
        env:
          RUN_LIVE_SCRAPER_TESTS: '1'
        run: npm run test:live
