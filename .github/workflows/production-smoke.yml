name: Production smoke

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/production-smoke.yml
      - scripts/production-smoke.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCTION_URL: https://myfilm-production.up.railway.app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run live Railway smoke test
        run: node scripts/production-smoke.mjs
      - name: Upload live smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-evidence
          path: production-smoke/
          if-no-files-found: warn
